name: soupdb-copyright

x-fma-audio: &fma-audio
  type: bind
  source: ${FMA_AUDIO_ROOT:?define FMA_AUDIO_ROOT (carpeta de FMA Small con 000/, 001/...)}
  target: /audio/fma
  read_only: true

services:
  soupdb:
    build:
      context: docker/soupdb
      additional_contexts:
        soupdb: ${SOUPDB_SOURCE:-../SoupDB}
    image: soupdb-copyright/soupdb:local
    volumes:
      - soupdb-data:/data          # base, HNSW, caché MFCC y codebook (solo SoupDB)
      - *fma-audio
      - audio-queries:/audio/queries
    ports:
      - "127.0.0.1:${SOUPDB_PUBLISH_PORT:-55432}:55432"   # solo para depurar desde el host
    stop_grace_period: 60s        # SIGTERM → el gestor cierra el Catalog (sin WAL)
    restart: unless-stopped

  copyright-api:
    build: .
    image: soupdb-copyright/api:local
    depends_on:
      soupdb:
        condition: service_healthy
    environment:
      SOUPDB_HOST: soupdb
      SOUPDB_PORT: "55432"
      COPYRIGHT_CORS_ORIGINS: ${COPYRIGHT_CORS_ORIGINS:-}
    volumes:
      - *fma-audio
      - audio-queries:/audio/queries
    ports:
      - "127.0.0.1:${COPYRIGHT_PUBLISH_PORT:-8000}:8000"
    restart: unless-stopped

  cevichito:
    profiles: ["demo"]
    build:
      context: ${CEVICHITO_SOURCE:-../CevichitoTrujillano}
    depends_on:
      copyright-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CEVICHITO_PUBLISH_PORT:-5173}:8080"

  # --- bootstrap (una vez) -------------------------------------------------------------
  bootstrap-manifest:
    profiles: ["bootstrap"]
    image: soupdb-copyright/api:local
    build: .
    command:
      - copyright-bootstrap
      - training-manifest
      - --catalog=/app/data/fma_small_catalog.json
      - --audio-root=/audio
      - --output=/artifacts/training_manifest.jsonl
      - --verify-audio
    volumes:
      - *fma-audio
      - bootstrap-artifacts:/artifacts

  codebook:
    profiles: ["bootstrap"]
    image: soupdb-copyright/soupdb:local
    depends_on:
      bootstrap-manifest:
        condition: service_completed_successfully
    # CLI oficial del plugin soupdb-vector, dentro de la imagen de SoupDB. No sobrescribe.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mkdir -p /data/artifacts &&
        if [ -f /data/artifacts/codebook.npz ]; then echo "codebook existente";
        else python -m soupdb_vector.multimedia.build_vectors
        /artifacts/training_manifest.jsonl /audio /data/cache
        /data/artifacts/codebook.npz /tmp/vectores.bin --k 128 --seed 0; fi &&
        sha256sum /data/artifacts/codebook.npz
    volumes:
      - soupdb-data:/data
      - *fma-audio
      - bootstrap-artifacts:/artifacts:ro

  bootstrap-catalog:
    profiles: ["bootstrap"]
    image: soupdb-copyright/api:local
    depends_on:
      codebook:
        condition: service_completed_successfully
      soupdb:
        condition: service_healthy
    environment:
      SOUPDB_HOST: soupdb
      SOUPDB_PORT: "55432"
    # Rutas del lado SoupDB: el backend solo las envía en CREATE EXTENSION por TCP.
    command:
      - copyright-bootstrap
      - catalog
      - --catalog=/app/data/fma_small_catalog.json
      - --storage-root=/data/plugins/hnsw
      - --profile-root=/audio
      - --codebook=/data/artifacts/codebook.npz
      - --cache=/data/cache

volumes:
  soupdb-data:
  audio-queries:
  bootstrap-artifacts:
